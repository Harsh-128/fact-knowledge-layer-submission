services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fact-layer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fact_layer
      POSTGRES_USER: fact_user
      POSTGRES_PASSWORD: fact_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fact_user -d fact_layer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fact-layer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: