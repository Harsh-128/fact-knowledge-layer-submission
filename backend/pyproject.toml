[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "A grounded fact knowledge layer for cross-document fact extraction and reasoning"
readme = {text = "Fact Knowledge Layer", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",

    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",

    "pymupdf>=1.24,<2.0",

    "openai>=1.50,<2.0",
    "google-genai>=1.0,<2.0",

    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",

    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "json-repair>=0.30,<1.0",

    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
