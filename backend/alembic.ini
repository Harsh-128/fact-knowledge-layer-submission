[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .

# Database URL is supplied dynamically by app.config.Settings.
sqlalchemy.url = postgresql+psycopg://fact_user:fact_password@localhost:5432/fact_layer

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
